name: mns_rider
description: Rider application for the M&S Delivery System.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  flutter_riverpod: ^2.6.1
  geolocator: ^13.0.2
  intl: ^0.20.1
  http: ^1.3.0
  latlong2: ^0.9.1
  path: ^1.9.0
  sqflite: ^2.4.1
  uuid: ^4.5.1
  mns_api_client:
    path: ../../packages/api_client
  mns_auth_session:
    path: ../../packages/auth_session
  mns_design_system:
    path: ../../packages/design_system
  mns_domain_models:
    path: ../../packages/domain_models
  mns_realtime_client:
    path: ../../packages/realtime_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

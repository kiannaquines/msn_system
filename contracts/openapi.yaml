openapi: 3.1.0
info:
  title: M&S Delivery API
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /api/health/live:
    get:
      operationId: healthLive
      responses:
        '200': {description: Process is alive}
  /api/health/ready:
    get:
      operationId: healthReady
      responses:
        '200': {description: Database is reachable}
  /api/v1/auth/register:
    post:
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Customer registered
          content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated
          content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      responses:
        '200': {description: Tokens rotated}
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Session revoked}
  /api/v1/stores:
    get:
      operationId: listStores
      responses:
        '200': {description: Available stores}
    post:
      operationId: createStore
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Store created}
  /api/v1/customers/me/addresses:
    get:
      operationId: listCustomerAddresses
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Saved addresses}
    post:
      operationId: createCustomerAddress
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Address created}
  /api/v1/stores/{store_id}/menu-items:
    get:
      operationId: listMenuItems
      parameters:
        - {in: path, name: store_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Store menu}
    post:
      operationId: createMenuItem
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: store_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '201': {description: Menu item created}
  /api/v1/orders:
    get:
      operationId: listOrders
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Role-scoped orders}
    post:
      operationId: createOrder
      security: [{bearerAuth: []}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrderRequest'}
      responses:
        '201':
          description: Order created
          content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}
  /api/v1/orders/{order_id}:
    get:
      operationId: getOrder
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: order_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Order snapshot}
  /api/v1/orders/{order_id}/assign:
    post:
      operationId: assignRider
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: order_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Rider assigned}
  /api/v1/deliveries/{delivery_id}:
    get:
      operationId: getDelivery
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: delivery_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Delivery snapshot
          content: {application/json: {schema: {$ref: '#/components/schemas/Delivery'}}}
  /api/v1/deliveries/{delivery_id}/status:
    post:
      operationId: updateDeliveryStatus
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: delivery_id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      responses:
        '200': {description: Status updated}
  /api/v1/deliveries/{delivery_id}/locations:
    post:
      operationId: recordLocation
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: delivery_id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      responses:
        '202': {description: Location accepted}
  /api/v1/deliveries/{delivery_id}/confirm-cod:
    post:
      operationId: confirmCod
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: delivery_id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      responses:
        '200': {description: COD marked paid}
  /api/v1/orders/{order_id}/feedback:
    post:
      operationId: submitFeedback
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: order_id, required: true, schema: {type: string, format: uuid}}
      responses:
        '201': {description: Feedback submitted}
  /api/v1/riders:
    get:
      operationId: listRiders
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Riders}
    post:
      operationId: createRider
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Rider created}
  /api/v1/riders/me/availability:
    put:
      operationId: setRiderAvailability
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Availability updated}
  /api/v1/reports/summary:
    get:
      operationId: getReportSummary
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Operational report}
  /api/v1/uploads/menu-images/authorize:
    post:
      operationId: authorizeMenuImageUpload
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Signed upload URL}
  /api/v1/uploads/menu-images/finalize:
    post:
      operationId: finalizeMenuImageUpload
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Image recorded}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    UserRole:
      type: string
      enum: [customer, rider, admin]
    OrderStatus:
      type: string
      enum: [pending, confirmed, assigned, picked_up, on_the_way, delivered, cancelled]
    PaymentStatus:
      type: string
      enum: [unpaid, paid]
    RiderStatus:
      type: string
      enum: [available, busy, offline]
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 2}
        email: {type: string, format: email}
        phone: {type: string}
        password: {type: string, minLength: 8}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, role]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, const: bearer}
        role: {$ref: '#/components/schemas/UserRole'}
    CreateOrderItem:
      type: object
      required: [menu_item_id, quantity]
      properties:
        menu_item_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 99}
    CreateOrderRequest:
      type: object
      required: [store_id, delivery_address_id, items]
      properties:
        store_id: {type: string, format: uuid}
        delivery_address_id: {type: string, format: uuid}
        notes: {type: string, maxLength: 500}
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/CreateOrderItem'}
    Order:
      type: object
      required: [id, status, payment_status, subtotal, delivery_fee, total]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/OrderStatus'}
        payment_status: {$ref: '#/components/schemas/PaymentStatus'}
        subtotal: {type: number}
        delivery_fee: {type: number}
        total: {type: number}
        delivery_id: {type: [string, 'null'], format: uuid}
    Delivery:
      type: object
      required: [id, order_id, status]
      properties:
        id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/OrderStatus'}
        latitude: {type: [number, 'null']}
        longitude: {type: [number, 'null']}
        eta_minutes: {type: [integer, 'null']}
        last_location_at: {type: [string, 'null'], format: date-time}
        store_name: {type: string}
        customer_name: {type: string}
        delivery_address: {type: string}
        pickup_latitude: {type: [number, 'null']}
        pickup_longitude: {type: [number, 'null']}
        destination_latitude: {type: [number, 'null']}
        destination_longitude: {type: [number, 'null']}
        total: {type: number}
        payment_status: {$ref: '#/components/schemas/PaymentStatus'}
